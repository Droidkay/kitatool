name: notch-robot-ci
on:
  push:
    branches: [notch-robot-ci]
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sw_vers > build.log; xcrun swiftc --version >> build.log 2>&1
          if swift build -c release >> build.log 2>&1; then echo "BUILD OK" >> build.log; else echo "BUILD FAILED" >> build.log; fi
      - name: Clips tab screenshot
        run: |
          BIN="$(swift build -c release --show-bin-path)/NotchPlayer"
          [ -f "$BIN" ] || exit 0
          D="$HOME/Library/Application Support/KitaClips"; mkdir -p "$D"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > "$D/history.json" <<JSON
          [{"id":"11111111-1111-1111-1111-111111111111","kind":"text","text":"Pray without ceasing. Give thanks in everything.","lastUsed":"$NOW","created":"$NOW","pinned":true,"useCount":0},
           {"id":"22222222-2222-2222-2222-222222222222","kind":"link","text":"https://kitatool.com/drop","lastUsed":"$NOW","created":"$NOW","pinned":false,"useCount":0},
           {"id":"33333333-3333-3333-3333-333333333333","kind":"code","text":"cd ~/Downloads/NotchPlayer && bash build.sh","lastUsed":"$NOW","created":"$NOW","pinned":false,"useCount":0},
           {"id":"44444444-4444-4444-4444-444444444444","kind":"number","text":"₦45,000","lastUsed":"$NOW","created":"$NOW","pinned":false,"useCount":0},
           {"id":"55555555-5555-5555-5555-555555555555","kind":"text","text":"MY NIGHT OF TURNAROUND: PRAY THIS BEFORE YOU SLEEP","lastUsed":"$NOW","created":"$NOW","pinned":false,"useCount":0}]
          JSON
          "$BIN" --clips-demo > clips.log 2>&1 & PID=$!
          sleep 6; screencapture -x clips.png; osascript -e "tell application \"System Events\" to key code 53" || true
          if kill -0 $PID 2>/dev/null; then echo "RUN OK" >> build.log; kill $PID; else echo "RUN CRASHED" >> build.log; cat clips.log >> build.log; fi
      - name: Publish result
        if: always()
        run: |
          mkdir -p /tmp/out && (cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log)
          cp clips.png /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b r
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "result ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" r:notch-robot-result-${{ matrix.os }}

name: notch-robot-ci
on:
  push:
    branches: [notch-robot-ci]
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sw_vers > build.log; xcrun swiftc --version >> build.log 2>&1
          if swift build -c release >> build.log 2>&1; then echo "BUILD OK" >> build.log; else echo "BUILD FAILED" >> build.log; fi
      - name: Record robot moves
        run: |
          BIN="$(swift build -c release --show-bin-path)/NotchPlayer"
          [ -f "$BIN" ] || exit 0
          "$BIN" --moves > moves.log 2>&1 & PID=$!
          sleep 2
          screencapture -x -V 32 -R 262,0,500,60 moves.mov || screencapture -x -V 32 moves.mov || true
          if kill -0 $PID 2>/dev/null; then echo "RUN OK" >> build.log; kill $PID; else echo "RUN CRASHED" >> build.log; cat moves.log >> build.log; fi
          ls -la moves.mov >> build.log 2>&1 || true
      - name: Publish result
        if: always()
        run: |
          mkdir -p /tmp/out && (cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log)
          cp moves.mov /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b r
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "result ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" r:notch-robot-result-${{ matrix.os }}

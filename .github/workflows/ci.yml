name: notch-robot-ci
on:
  push:
    branches: [notch-robot-ci]
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sw_vers > build.log; xcrun swiftc --version >> build.log 2>&1
          if swift build -c release >> build.log 2>&1; then echo "BUILD OK" >> build.log; else echo "BUILD FAILED" >> build.log; fi
      - name: Notification reader test
        run: |
          BIN="$(swift build -c release --show-bin-path)/NotchPlayer"
          [ -f "$BIN" ] || exit 0
          "$BIN" --notes-test > notes.log 2>&1 & PID=$!
          sleep 4
          osascript -e 'display notification "Hello from the build machine" with title "CI Test"' || true
          sleep 9
          kill $PID 2>/dev/null || true
          echo "--- notes test" >> build.log; grep -E "paths|status" notes.log | sort -u | head -8 >> build.log
      - name: Demo screenshots
        run: |
          BIN="$(swift build -c release --show-bin-path)/NotchPlayer"
          [ -f "$BIN" ] || exit 0
          "$BIN" --demo > demo.log 2>&1 & PID=$!
          sleep 5;  screencapture -x s1.png
          sleep 9;  screencapture -x s2.png
          sleep 9;  screencapture -x s3.png
          if kill -0 $PID 2>/dev/null; then echo "RUN OK" >> build.log; kill $PID; else echo "RUN CRASHED" >> build.log; tail -20 demo.log >> build.log; fi
      - name: Publish result
        if: always()
        run: |
          mkdir -p /tmp/out && (cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log)
          cp s1.png s2.png s3.png /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b r
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "result ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" r:notch-robot-result-${{ matrix.os }}
